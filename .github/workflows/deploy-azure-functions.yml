name: Deploy Azure Functions TS

on:
  push:
    branches: [main]
    paths:
      - 'azure-functions-ts/**'
      - '.github/workflows/deploy-azure-functions.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: azure-functions-ts

      - name: Build TypeScript
        run: npm run build
        working-directory: azure-functions-ts

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'func-geosupplyguard-ts'
          package: './azure-functions-ts'
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
